name: Oculus
description: >-
  Oculus is the virtual-reality company founded in 2012 that Kickstarter-launched the Rift headset
  and was backed by Spark Capital, Matrix Partners and others before Facebook acquired it in 2014 for
  roughly two billion dollars. The Oculus consumer brand has since been folded into Meta Quest, and the
  Oculus developer platform now lives as the Meta Horizon developer program at developers.meta.com/horizon.
  It offers the Oculus/Meta Platform SDK, the Meta Spatial SDK, OpenXR-native, Unity and Unreal engine
  integrations, and Immersive Web tooling for building mixed- and virtual-reality apps for Horizon OS and
  the Horizon Store. The oculus.com domain now redirects to Meta Quest, and developer.oculus.com redirects
  to the Meta Horizon developer portal.
